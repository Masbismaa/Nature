<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
  <style>
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1100px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sway { 0%, 100% { transform: skewX(-6deg); } 50% { transform: skewX(6deg); } }
    @keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(40px, -70px) scale(1.8); opacity: 0; } }
    @keyframes leaf { 0% { transform: translate(-40px, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(960px, 60px) rotate(720deg); opacity: 0; } }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .cloud { animation: drift var(--d, 60s) linear var(--s, 0s) infinite; }
    .grass { transform-box: fill-box; transform-origin: bottom; animation: sway 3s ease-in-out var(--s, 0s) infinite; }
    .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 4s ease-out var(--s, 0s) infinite; }
    .leaf { animation: leaf var(--d, 7s) linear var(--s, 0s) infinite; }
    @keyframes g0 { 0%, 10% { transform: scale(0); } 16%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .g0 { transform-box: fill-box; transform-origin: bottom; animation: g0 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes g1 { 0%, 24% { transform: scale(0); } 30%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .g1 { transform-box: fill-box; transform-origin: bottom; animation: g1 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes g2 { 0%, 38% { transform: scale(0); } 44%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .g2 { transform-box: fill-box; transform-origin: bottom; animation: g2 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes g3 { 0%, 52% { transform: scale(0); } 58%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .g3 { transform-box: fill-box; transform-origin: bottom; animation: g3 7s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes g4 { 0%, 66% { transform: scale(0); } 72%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .g4 { transform-box: fill-box; transform-origin: bottom; animation: g4 7s cubic-bezier(.34,1.56,.64,1) infinite; }
  </style>
