<svg xmlns="http://www.w3.org/2000/svg" width="900" height="112" viewBox="0 0 900 112">
  <style>
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1100px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sway { 0%, 100% { transform: skewX(-6deg); } 50% { transform: skewX(6deg); } }
    @keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(40px, -70px) scale(1.8); opacity: 0; } }
    @keyframes leaf { 0% { transform: translate(-40px, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(960px, 60px) rotate(720deg); opacity: 0; } }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .cloud { animation: drift var(--d, 60s) linear var(--s, 0s) infinite; }
    .grass { transform-box: fill-box; transform-origin: bottom; animation: sway 3s ease-in-out var(--s, 0s) infinite; }
    .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 4s ease-out var(--s, 0s) infinite; }
    .leaf { animation: leaf var(--d, 7s) linear var(--s, 0s) infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .bob { animation: bob 2.4s ease-in-out infinite; }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
  </style>
  <rect width="900" height="112" fill="#F7F1E3" rx="14"/>
  <g class="leaf" style="--d:7.1s;--s:-1.7s"><ellipse cx="0" cy="49" rx="6" ry="3.5" fill="#9BC47A"/></g><g class="leaf" style="--d:8.0s;--s:-8.1s"><ellipse cx="0" cy="58" rx="6" ry="3.5" fill="#9BC47A"/></g><g class="leaf" style="--d:8.9s;--s:-1.5s"><ellipse cx="0" cy="33" rx="6" ry="3.5" fill="#6FA35E"/></g><g class="leaf" style="--d:6.6s;--s:-2.1s"><ellipse cx="0" cy="70" rx="6" ry="3.5" fill="#C9892F"/></g><g class="leaf" style="--d:9.1s;--s:-3.5s"><ellipse cx="0" cy="35" rx="6" ry="3.5" fill="#6FA35E"/></g><g class="leaf" style="--d:9.7s;--s:-1.8s"><ellipse cx="0" cy="61" rx="6" ry="3.5" fill="#6FA35E"/></g>
  <g class="bob"><rect x="170" y="26" width="560" height="62" rx="10" fill="#2A4A32"/><rect x="170" y="20" width="560" height="62" rx="10" fill="#3E6B48"/>
  <path d="M205 51 q12 -16 26 -9 q-5 16 -26 9 z" fill="#fff"/>
  <text x="450" y="59" text-anchor="middle" font-family="'Bitter','Rockwell',Georgia,serif" font-size="24" font-weight="700" fill="#fff">Jalan-jalan ke lembah interaktif</text>
  <g class="arrow"><path d="M660 51 h36 M684 41 l12 10 -12 10" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></g></g>
</svg>
