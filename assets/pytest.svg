<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  <style>
    @keyframes drift { from { transform: translateX(-260px); } to { transform: translateX(1100px); } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes sway { 0%, 100% { transform: skewX(-6deg); } 50% { transform: skewX(6deg); } }
    @keyframes smoke { 0% { transform: translate(0, 0) scale(.6); opacity: 0; } 20% { opacity: .9; } 100% { transform: translate(40px, -70px) scale(1.8); opacity: 0; } }
    @keyframes leaf { 0% { transform: translate(-40px, 0) rotate(0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(960px, 60px) rotate(720deg); opacity: 0; } }
    .rise { animation: rise .9s cubic-bezier(.22,1,.36,1) var(--s, 0s) both; }
    .cloud { animation: drift var(--d, 60s) linear var(--s, 0s) infinite; }
    .grass { transform-box: fill-box; transform-origin: bottom; animation: sway 3s ease-in-out var(--s, 0s) infinite; }
    .smoke { transform-box: fill-box; transform-origin: center; animation: smoke 4s ease-out var(--s, 0s) infinite; }
    .leaf { animation: leaf var(--d, 7s) linear var(--s, 0s) infinite; }
    @keyframes b0 { 0%, 8% { transform: scale(0); } 12%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b0 { transform-box: fill-box; transform-origin: bottom; animation: b0 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b1 { 0%, 15% { transform: scale(0); } 19%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b1 { transform-box: fill-box; transform-origin: bottom; animation: b1 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b2 { 0%, 22% { transform: scale(0); } 26%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b2 { transform-box: fill-box; transform-origin: bottom; animation: b2 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b3 { 0%, 29% { transform: scale(0); } 33%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b3 { transform-box: fill-box; transform-origin: bottom; animation: b3 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b4 { 0%, 36% { transform: scale(0); } 40%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b4 { transform-box: fill-box; transform-origin: bottom; animation: b4 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b5 { 0%, 43% { transform: scale(0); } 47%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b5 { transform-box: fill-box; transform-origin: bottom; animation: b5 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes b6 { 0%, 50% { transform: scale(0); } 54%, 92% { transform: scale(1); } 100% { transform: scale(0); } }
    .b6 { transform-box: fill-box; transform-origin: bottom; animation: b6 11s cubic-bezier(.34,1.56,.64,1) infinite; }
    @keyframes stamp { 0%, 60% { transform: scale(0) rotate(-12deg); } 64% { transform: scale(1.12) rotate(-6deg); } 68%, 92% { transform: scale(1) rotate(-6deg); } 100% { transform: scale(0); } }
    .stamp { transform-box: fill-box; transform-origin: center; animation: stamp 11s ease-out infinite; }
  </style>
